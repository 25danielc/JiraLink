name: changelog

on:
  workflow_dispatch: {} # manual "Run workflow" button (escape hatch / reprocess)
  repository_dispatch: # fired by Jira's "Send web request" when a ticket completes
    types: [jira-ticket-completed]

permissions:
  contents: write # lets the job commit + push the rendered Markdown

# Don't pile up overlapping publishes.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the bot commit pushes cleanly

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect from Jira
        run: node scripts/collect.js
        env:
          JIRA_BASE: ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          # Text source: leave unset for "summary" (default). Set the repo
          # variable TEXT_SOURCE=field to use the custom Changelog Entry field.
          TEXT_SOURCE: ${{ vars.TEXT_SOURCE }}
          CHANGELOG_FIELD_ID: ${{ secrets.CHANGELOG_FIELD_ID }}
          COMPLETED_STATUS: ${{ secrets.COMPLETED_STATUS }}
          # Custom field ids for the collapsible format (Fix Version uses the
          # built-in fixVersions, so no secret needed for it).
          SPRINT_FIELD_ID: ${{ secrets.SPRINT_FIELD_ID }}
          PACKAGE_VERSION_FIELD_ID: ${{ secrets.PACKAGE_VERSION_FIELD_ID }}

      - name: Render feed
        run: node scripts/render.js
        env:
          JIRA_BASE: ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}

      - name: Publish (commit + push)
        run: node scripts/publish.js
        env:
          JIRA_BASE: ${{ secrets.JIRA_BASE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
